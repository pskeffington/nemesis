name: Nemesis theme ISO staging (unprivileged Docker)

# Experimental KDE payload profile tests: no privileged containers or secrets.
on:
  push:
    branches: [feat/nemesis-brand-v0-1]
    paths:
      - '.github/workflows/theme-iso-stage.yml'
      - 'brand/**'
      - 'profiles/mac-intel-theme-preview/**'
      - 'scripts/prepare-theme-profile.sh'
      - 'scripts/prepare-profile.sh'
      - 'scripts/build-iso.sh'
      - 'tests/test-theme-iso-staging.sh'
      - 'tests/qml/**'
      - 'tests/test_theme_interactivity.py'
  pull_request:
    paths:
      - '.github/workflows/theme-iso-stage.yml'
      - 'brand/**'
      - 'profiles/mac-intel-theme-preview/**'
      - 'scripts/prepare-theme-profile.sh'
      - 'scripts/prepare-profile.sh'
      - 'scripts/build-iso.sh'
      - 'tests/test-theme-iso-staging.sh'
      - 'tests/qml/**'
      - 'tests/test_theme_interactivity.py'

permissions:
  contents: read

concurrency:
  group: theme-iso-source-staging
  cancel-in-progress: true

jobs:
  arch-theme-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate ArchISO profile in non-privileged Arch Docker container
        run: |
          docker run --rm --security-opt no-new-privileges \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed archiso librsvg file python diffutils qt6-declarative qt6-svg
              python3 -m unittest discover -s tests -p test_theme_interactivity.py -v
              for qml in brand/plasmoid/org.nemesis.themecontrols/contents/ui/*.qml tests/qml/*.qml; do
                /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
              done
              QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software /usr/lib/qt6/bin/qmltestrunner -input tests/qml -platform offscreen
              bash tests/test-theme-iso-staging.sh
            '
