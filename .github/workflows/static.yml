name: Nemesis static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate scripts and manifest
        run: bash scripts/validate.sh

  archiso-profile:
    name: Current packaged ArchISO releng contract
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install signed ArchISO package
        run: pacman -Syu --noconfirm --needed archiso
      - name: Stage official releng with Nemesis overlay
        run: bash tests/test-installed-releng.sh
      - name: Verify MacBook Air staging and field service hardening
        run: bash tests/test-installed-air-profile.sh
      - name: Stage Operator edition with a mocked pinned wallpaper asset
        run: bash tests/test-installed-operator-profile.sh
      - name: Resolve all optional Operator kit packages from signed Arch repositories
        run: bash tests/test-operator-package-repos.sh
